# Site ENTEC 2026 — publicado na Netlify a partir do repositório crdso/entecifto.
# O build copia site/ para dist/, gera dist/env.js e valida links, CSP e manifesto da galeria.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Variáveis obrigatórias no painel da Netlify (Site configuration -> Environment variables),
# as mesmas do site anterior:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY   (chave pública anon; o build recusa qualquer outra)
#   VITE_ADMIN_EMAIL

[functions]
  directory = "netlify/functions"

# /api/foto        -> netlify/functions/foto.mjs        (download de 1 original, attachment)
# /api/resultados  -> netlify/functions/resultados.mjs  (pódio público, mesma origem)
# /api/zip/*       -> netlify/edge-functions/zip.js     (ZIP das selecionadas, streaming)
