<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--ENTEC:HEAD-->
  <title>Página não encontrada | ENTEC 2026</title>
  <meta name="description" content="A página que você tentou acessar não existe ou pode ter sido movida.">
  <meta name="theme-color" content="#07003e">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!--/ENTEC:HEAD-->
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/hero.css">
  <link rel="stylesheet" href="/certificado/certificado.css">
  <script src="/hero-shader.js?v=4" defer></script>
  <style>
    .notfound-main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; width: min(100% - 72px, 1180px); margin-inline: auto; padding: 40px 0 120px; }
    .notfound-main p.kicker { margin: 0 0 22px; color: #fff; font: 700 11px/1.4 "Inter", sans-serif; letter-spacing: .24em; text-transform: uppercase; }
    .notfound-main h1 { margin: 0; color: #fff; font: 400 clamp(56px, 7vw, 112px)/.95 "Sora", sans-serif; letter-spacing: -.075em; }
    .notfound-main h1 em { font-style: normal; color: #d8d2ff; }
    .notfound-main p.text { max-width: 460px; margin: 26px 0 34px; color: rgba(255,255,255,.82); font: 400 17px/1.6 "Inter", sans-serif; }
    .notfound-main a { align-self: flex-start; display: inline-flex; align-items: center; min-height: 50px; padding: 0 26px; border-radius: 100px; background: #f2efff; color: #1b133e; text-decoration: none; font: 700 13px "Inter", sans-serif; }
    @media (max-width: 809.98px) { .notfound-main { width: calc(100% - 40px); } }
  </style>
</head>
<body>
  <div class="cert-page">
    <div class="uh-bg" aria-hidden="true"></div>
    <div class="uh-shader" aria-hidden="true"><canvas id="uh-canvas"></canvas></div>
    <header class="cert-header">
      <a class="cert-logo" href="/" aria-label="ENTEC 2026 — início">
        <img src="/assets/entec-icon-header.webp" alt="ENTEC" width="76" height="76">
      </a>
    </header>
    <main class="notfound-main">
      <p class="kicker">Erro 404</p>
      <h1>Página não <em>encontrada</em></h1>
      <p class="text">A página que você tentou acessar não existe ou pode ter sido movida.</p>
      <a href="/">Voltar ao início</a>
    </main>
    <footer class="cert-footer"><span>© 2026 ENTEC · Instituto Federal do Tocantins</span><span>dev: cardoso</span></footer>
  </div>
</body>
</html>
